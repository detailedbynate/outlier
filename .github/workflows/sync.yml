name: Scheduled sync

# Runs the job queue on the deployed app: daily channel refreshes and snapshot pruning.
# The schedule is off: the app's own server runs outlier-tick.timer every two
# minutes, which is both faster and free. Kept for manual runs against a
# deployment that has no scheduler of its own.
# Requires repository secrets APP_URL and CRON_SECRET.
on:
  workflow_dispatch: {}

concurrency:
  group: scheduled-sync
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Run queued jobs
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Set the APP_URL and CRON_SECRET repository secrets."
            exit 1
          fi
          # --location follows domain redirects (e.g. apex -> www); curl keeps POST on 307/308.
          curl --fail-with-body --silent --show-error --max-time 90 --location \
            -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${APP_URL%/}/api/cron/tick"
