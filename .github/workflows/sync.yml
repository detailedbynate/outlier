name: Scheduled sync

# Runs the job queue on the deployed app: daily channel refreshes and snapshot pruning.
# Requires repository secrets APP_URL (e.g. https://outlier.vercel.app) and CRON_SECRET.
on:
  schedule:
    - cron: "7 * * * *" # hourly, off the top of the hour when GitHub is busiest
  workflow_dispatch: {}

concurrency:
  group: scheduled-sync
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Run queued jobs
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Set the APP_URL and CRON_SECRET repository secrets."
            exit 1
          fi
          curl --fail-with-body --silent --show-error --max-time 90 \
            -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${APP_URL%/}/api/cron/tick"
