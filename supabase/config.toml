# Supabase CLI local development config. Omitted settings use CLI defaults.
# Docs: https://supabase.com/docs/guides/local-development/cli/config
project_id = "yt-intelligence"

[api]
enabled = true
port = 54321
schemas = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "500MiB"

[storage.buckets.media]
public = false
file_size_limit = "500MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
